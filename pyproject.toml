[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "listenr"
dynamic = ["version"]
description = "Record speech, clean it up with local AI, and fine-tune your own ASR model"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rebreda" }]
keywords = [
    "asr",
    "speech-to-text",
    "whisper",
    "fine-tuning",
    "lora",
    "lemonade",
    "local-ai",
    "transcription",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests",
    "websockets",
    "sounddevice",
    "soundfile",
    "numpy",
    "scipy",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pandas",  # the importer tests build DataFrames
]
mdc = [
    "datacollective>=0.5.2",
    "pandas",
    "python-dotenv",
]
hf = [
    "datasets",
    "pandas",
    "python-dotenv",
]
categorize = [
    "sentence-transformers",
]
finetune = [
    "transformers>=4.40",
    "peft>=0.11",
    "accelerate>=0.29",
    "datasets",
    "evaluate",
    "jiwer",
    "tensorboard",
]

[project.urls]
Homepage = "https://github.com/Rebreda/listenr"
Repository = "https://github.com/Rebreda/listenr"
Issues = "https://github.com/Rebreda/listenr/issues"
Documentation = "https://github.com/Rebreda/listenr/tree/main/docs"

[project.scripts]
listenr = "listenr.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags (v0.2.0 -> 0.2.0); untagged builds get a .devN version.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
