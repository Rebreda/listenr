[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "listenr"
dynamic = ["version"]
description = "Real-time microphone transcription via Lemonade ASR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "websockets",
    "sounddevice",
    "soundfile",
    "numpy",
    "scipy",
    "pandas",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
mdc = [
    "datacollective>=0.5.2",
    "python-dotenv",
]
hf = [
    "datasets",
    "python-dotenv",
]
categorize = [
    "sentence-transformers",
]
finetune = [
    "transformers>=4.40",
    "peft>=0.11",
    "accelerate>=0.29",
    "datasets",
    "evaluate",
    "jiwer",
    "tensorboard",
]

[project.scripts]
listenr = "listenr.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags (v0.2.0 -> 0.2.0); untagged builds get a .devN version.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
